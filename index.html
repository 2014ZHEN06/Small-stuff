<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="color-scheme" content="dark" />
<title>微缩世界 · Small Worlds</title>
<style>
  :root{
    --ink:#060809;
    --paper:#f1e9db;
    --muted:rgba(241,233,219,.52);
    --line:rgba(255,255,255,.09);
    --gold:#d9b98d;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Inter","Helvetica Neue",-apple-system,"Segoe UI","PingFang SC","Songti SC",serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* 背景 */
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 32%, #000 20%, transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 32%, #000 20%, transparent 100%);
    opacity:.55;
  }
  .bg-stars{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 50%, transparent 100%),
      radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.45) 50%, transparent 100%),
      radial-gradient(1.2px 1.2px at 34% 8%, rgba(255,255,255,.35) 50%, transparent 100%),
      radial-gradient(1px 1px at 62% 26%, rgba(255,255,255,.4) 50%, transparent 100%),
      radial-gradient(1.4px 1.4px at 88% 34%, rgba(255,255,255,.3) 50%, transparent 100%),
      radial-gradient(1px 1px at 22% 42%, rgba(255,255,255,.3) 50%, transparent 100%),
      radial-gradient(1px 1px at 52% 6%, rgba(255,255,255,.4) 50%, transparent 100%),
      radial-gradient(1.2px 1.2px at 6% 60%, rgba(255,255,255,.22) 50%, transparent 100%);
  }
  .bg-glow{
    position:fixed;left:0;top:0;width:900px;height:900px;z-index:0;pointer-events:none;
    background:radial-gradient(circle at center, rgba(126,215,193,.09), rgba(126,215,193,0) 62%);
    transform:translate(-50%,-50%);
    transition:opacity .6s;
    will-change:transform;
  }
  .bg-vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(3,5,6,.55) 100%);
  }

  main{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 40px;}

  /* 页头 */
  header{text-align:center;margin-bottom:clamp(44px,6vw,76px);}
  .eyebrow{
    font-size:10px;letter-spacing:.5em;color:rgba(217,185,141,.62);
    margin-bottom:22px;font-weight:600;
  }
  h1{
    font-family:Georgia,"Songti SC","Noto Serif SC",serif;
    font-size:clamp(42px,7.4vw,88px);
    font-weight:400;letter-spacing:.2em;
    line-height:1.05;
    text-indent:.2em;
    color:#f7f1e4;
    text-shadow:0 10px 60px rgba(0,0,0,.6);
  }
  .lede{
    margin-top:20px;font-size:13px;line-height:2.1;letter-spacing:.14em;
    color:var(--muted);
  }
  .rule{
    width:66px;height:1px;margin:30px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:.6;
  }

  /* 卡片网格 */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(16px,2.4vw,26px);
    perspective:1200px;
  }
  .card{
    position:relative;
    display:flex;flex-direction:column;
    border-radius:20px;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.014));
    border:1px solid var(--line);
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
    transform:perspective(1000px) translateY(0) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .5s cubic-bezier(.2,.8,.2,1), border-color .4s, box-shadow .5s;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
    will-change:transform;
  }
  .card:nth-child(1){animation-delay:.05s;}
  .card:nth-child(2){animation-delay:.16s;}
  .card:nth-child(3){animation-delay:.27s;}
  @keyframes rise{
    from{opacity:0;transform:translateY(26px) scale(.985);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .card:not(.ghost):hover{
    transform:perspective(1000px) translateY(-8px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    border-color:color-mix(in srgb, var(--accent) 46%, transparent);
    box-shadow:
      0 36px 70px -30px rgba(0,0,0,.95),
      0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent),
      0 0 60px -18px color-mix(in srgb, var(--accent) 26%, transparent);
  }

  .thumb{
    position:relative;height:212px;overflow:hidden;flex:none;
    background:#050807;
  }
  .thumb svg{
    position:absolute;inset:0;width:100%;height:100%;
    transition:transform 1s cubic-bezier(.2,.8,.2,1);
    display:block;
  }
  .card:hover .thumb svg{transform:scale(1.055);}
  .thumb::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(6,8,9,0) 45%,rgba(6,8,9,.72) 88%,rgba(6,8,9,.94) 100%);
  }
  .badge{
    position:absolute;top:14px;left:14px;z-index:2;
    font-size:9px;letter-spacing:.24em;font-weight:600;
    padding:7px 11px;border-radius:999px;
    color:#0d1512;
    background:linear-gradient(180deg,#f2ddb6,#d9b98d);
    box-shadow:0 4px 16px rgba(217,185,141,.28);
  }
  .badge.soon{
    color:#cfe9ff;background:rgba(10,20,28,.6);
    border:1px solid rgba(140,210,255,.35);
    box-shadow:inset 0 0 20px rgba(120,200,255,.08);
  }
  .badge.new{
    color:#08120f;background:linear-gradient(180deg,#bff2e0,#7fd6c0);
    box-shadow:0 4px 16px rgba(127,214,192,.25);
  }

  .meta{
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:18px 22px 6px;
  }
  .meta h2{
    font-family:Georgia,"Songti SC",serif;
    font-size:21px;font-weight:400;letter-spacing:.12em;color:#f6efe2;
  }
  .meta p{
    margin-top:7px;font-size:10.5px;letter-spacing:.22em;
    color:rgba(241,233,219,.42);text-transform:uppercase;
  }
  .go{
    font-size:18px;color:var(--accent);
    opacity:.65;transform:translate(0,0);
    transition:opacity .3s, transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .go{opacity:1;transform:translate(4px,-2px);}
  .tags{
    display:flex;gap:7px;flex-wrap:wrap;
    padding:12px 22px 20px;
  }
  .tags span{
    font-size:9.5px;letter-spacing:.14em;
    color:rgba(241,233,219,.45);
    padding:4px 9px;border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.02);
  }

  /* 占位卡 */
  .ghost{
    border:1px dashed rgba(255,255,255,.14);
    background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.006));
    display:flex;align-items:center;justify-content:center;
    min-height:330px;
    cursor:default;
    animation-delay:.38s;
  }
  .ghost:hover{
    border-color:rgba(217,185,141,.3);
    box-shadow:0 0 50px -20px rgba(217,185,141,.14);
  }
  .ghost-inner{text-align:center;padding:24px;}
  .plus{
    width:46px;height:46px;margin:0 auto 20px;border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    color:rgba(217,185,141,.72);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:200;
    background:radial-gradient(circle at center, rgba(217,185,141,.08), transparent 70%);
  }
  .ghost-inner p{
    font-size:12px;line-height:2;letter-spacing:.2em;
    color:rgba(241,233,219,.42);
  }
  .ghost-inner p span{
    font-size:10px;letter-spacing:.28em;color:rgba(241,233,219,.24);
  }

  footer{
    margin-top:clamp(44px,6vw,70px);
    padding-top:22px;
    border-top:1px solid rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    font-size:10px;letter-spacing:.24em;color:rgba(241,233,219,.28);
  }
  footer b{font-weight:500;color:rgba(217,185,141,.55);}

  @media (max-width:980px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .ghost{grid-column:1/-1;min-height:180px;}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr;}
    .thumb{height:186px;}
    footer{justify-content:center;text-align:center;}
    .ghost{min-height:160px;}
  }
  @media (prefers-reduced-motion:reduce){
    .card{animation:none;}
    .thumb svg{transition:none;}
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-stars"></div>
<div class="bg-glow" id="glow"></div>
<div class="bg-vignette"></div>

<main>
  <header>

  <section class="grid">

        <span class="badge">可进入</span>
      </div>
      <div class="meta">

          <h2>林间小屋</h2>
          <p>Cabin in the Woods</p>
        </div>
        <span class="go">→</span>

      <div class="tags"><span>森林</span><span>昼夜循环</span><span>萤火</span></div>
    </a>

    <!-- 微缩生态 -->
    <a class="card" href="./terrarium.html" style="--accent:#9fd8ff" data-tilt>
      <div class="thumb">
        <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">

            </linearGradient>

      <div class="meta">

    <!-- 占位 -->

  <footer>
    <span>微缩世界 · 持续生长中</span>
    <span>BUILT WITH <b>THREE.JS</b> · WEBGL</span>
  </footer>
</main>

<script>
  // 鼠标柔光
  const glow = document.getElementById('glow');
  let gx = window.innerWidth / 2, gy = window.innerHeight * 0.35;
  let tx = gx, ty = gy;
  window.addEventListener('pointermove', (e) => {
    tx = e.clientX; ty = e.clientY;
    glow.style.opacity = '1';
  }, { passive: true });
  (function loop() {
    gx += (tx - gx) * 0.08;
    gy += (ty - gy) * 0.08;
    glow.style.transform = `translate(${gx - 450}px, ${gy - 450}px)`;
    requestAnimationFrame(loop);
  })();

  // 卡片轻微 3D 倾斜
  const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (canHover) {
    document.querySelectorAll('[data-tilt]').forEach((card) => {
      card.addEventListener('pointermove', (e) => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        card.style.setProperty('--ry', (x * 7).toFixed(2) + 'deg');
        card.style.setProperty('--rx', (-y * 5).toFixed(2) + 'deg');
      });
      card.addEventListener('pointerleave', () => {
        card.style.setProperty('--ry', '0deg');
        card.style.setProperty('--rx', '0deg');
      });
    });
  }
</script>
</body>
</html>
